name: Daily Scraper Trigger

on:
  schedule:
    # Her gün Türkiye saatiyle 09:00'da çalışır (UTC 06:00)
    - cron: '0 6 * * *'
  workflow_dispatch: # İstediğinde GitHub sitesinden "Run" butonuna basıp elle tetiklemek için

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ana Kodu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py # <-- Buraya senin ANA dosyanın adı neyse onu yazacaksın
